<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RxJS AJAX-Fortschritt – Demo</title>
</head>
<body>

  <h1>RxJS AJAX-Fortschritt</h1>

  <h2>Upload</h2>
  <input type="file" id="upload-input">
  <button id="upload-button">Datei hochladen</button>
  <progress id="upload-progress" value="0" max="100"></progress>
  <span id="upload-status">Bereit.</span>

  <h2>Download</h2>
  <input
    type="text"
    id="download-url"
    placeholder="/assets/beispiel.pdf"
  >
  <button id="download-button">Datei herunterladen</button>
  <progress id="download-progress" value="0" max="100"></progress>
  <span id="download-status">Bereit.</span>

  <script type="module" src="./app.js"></script>

</body>
</html>
